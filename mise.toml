[tools]
python = "3.12.14"
node = "22.23.2"
pnpm = "10.34.5"

[env]
_.python.venv = { path = "{{env.HOME}}/.venv", create = true }
DATABASE_URL = "postgresql://bastolk:bastolk@localhost:5442/bastolk"
REDIS_URL = "redis://localhost:6382"
OLLAMA_BASE_URL = "http://localhost:11434"
MODELS_DIR = "/models"

[tasks.services]
run = "docker compose up -d postgres redis"

[tasks.install]
run = "pnpm install && pip install -r ml/requirements.txt"

[tasks.dev]
run = "pnpm dev"

[tasks.build]
run = "pnpm build"

[tasks.test]
run = "pnpm test"

[tasks."test:e2e"]
run = "pnpm test:e2e"
